# Temporary HTTP-only site used once to obtain the first certificate (docs/DEPLOY.md step 12).
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 503;
    }
}
