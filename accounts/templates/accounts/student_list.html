{% extends "base.html" %}
{% block content %}
  <h1>Студенты факультета</h1>
  <p>{{ faculty.name }}</p>
  {% if students %}
    <ul class="student-list">
      {% for student in students %}
        <li>
          <a href="{% url 'accounts:staff_student_detail' student.pk %}">{{ student.full_name }}</a>
          · {{ student.group.name }}, {{ student.course }} курс
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Студентов нет.</p>
  {% endif %}
{% endblock %}
